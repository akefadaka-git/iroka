[package]
name = "iroka-task-api"
version = "0.1.0"
description = "First-party IROKA task lifecycle contracts and PostgreSQL persistence"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
postgres = { version = "=0.19.12", features = ["with-serde_json-1"] }
postgres-native-tls = "=0.5.0"
native-tls = "=0.2.12"
iroka-kernel = { path = "../iroka-kernel" }

[lints]
workspace = true

[package]
name = "iroka-kernel"
version = "0.1.0"
description = "Deterministic, fail-closed authorization decision core for IROKA ZERO"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
dev-no-revocations = []
test-support = []

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "=0.2.0"
sha1 = "=0.10.6"
sha2 = "=0.10.9"
rusqlite = { version = "=0.32.1", features = ["bundled"] }

[lints]
workspace = true

name: Format Rust on G08 workflow-graph branch

on:
  push:
    branches:
      - implementation/a3-g08-character-workflow-graph
    paths:
      - "crates/**/*.rs"
      - ".github/workflows/format-rust-g08-workflow-graph.yml"

permissions:
  contents: write

concurrency:
  group: format-rust-g08-workflow-graph
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout G08 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install stable Rust formatter
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatting if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates
            git commit -m "style(g08): apply rustfmt to workflow graph"
            git push origin HEAD:implementation/a3-g08-character-workflow-graph
          fi

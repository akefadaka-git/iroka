name: Dependency lock refresh preview

on:
  pull_request:
    branches: [architecture/genesis-gene-contract-amendment-proposal]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/iroka-kernel/Cargo.toml"

permissions:
  contents: read

concurrency:
  group: lock-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.100.0
          rustc --version
          cargo --version

      - name: Resolve patched SQLite dependency
        run: cargo update -p rusqlite --precise 0.42.0

      - name: Validate locked dependency graph
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Compile and test refreshed dependency graph
        run: |
          cargo check --workspace --all-targets --locked
          cargo test --workspace --all-targets --locked
          cargo build --workspace --release --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -A clippy::pedantic

      - name: Emit refreshed Cargo.lock for Owner-controlled commit
        run: |
          echo "LOCKFILE_BEGIN"
          cat Cargo.lock
          echo "LOCKFILE_END"

name: Rust kernel verification

on:
  push:
    branches: [feat/igacms-a3-implementation]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "docs/constitutional/IGACMS-A3-IMPLEMENTATION-RECORD.md"
      - ".github/workflows/rust-kernel.yml"
  pull_request:
    branches: [main, architecture/igacms-a2-ci-base, architecture/genesis-gene-contract-amendment-proposal]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "docs/architecture/G01-CREDENTIAL-VERIFICATION.md"
      - "docs/architecture/G01-IDENTITY-CONTRACT.md"
      - "docs/constitutional/IGACMS-A3-IMPLEMENTATION-RECORD.md"
      - ".github/workflows/rust-kernel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-kernel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, compile, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.100.0
          rustc --version
          cargo --version


      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile all targets
        run: cargo check --workspace --all-targets --locked

      - name: Verify production feature set excludes development bypasses
        run: cargo check --workspace --all-targets --no-default-features

      - name: Run complete unit and contract test suite
        run: cargo test --workspace --all-targets --locked

      - name: Build optimized workspace
        run: cargo build --workspace --release --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -A clippy::pedantic

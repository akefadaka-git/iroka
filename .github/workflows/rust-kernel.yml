name: Rust kernel verification

on:
  push:
    branches: [feat/igacms-a3-implementation, implementation/a3-character-genome-v1, implementation/a3-g01-identity-root, implementation/a3-g07-ci-matrix]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "docs/architecture/a3/**"
      - "scripts/a3_schema_baseline_audit.py"
      - "docs/architecture/IROKA-A2-CHARACTER-GENE-CONTRACTS-v1.0.0.json"
      - "docs/architecture/IROKA-A2-CHARACTER-CONFORMANCE-CATALOG-v1.0.0.json"
      - "docs/constitutional/IGACMS-A3-IMPLEMENTATION-RECORD.md"
      - ".github/workflows/rust-kernel.yml"
  pull_request:
    branches: [main, architecture/igacms-a2-ci-base, architecture/a2-character-gene-contracts-v2, implementation/a3-g07-agent-principal, implementation/a3-g07-ci-matrix]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/a3_schema_baseline_audit.py"
      - "docs/architecture/IROKA-A2-CHARACTER-GENE-CONTRACTS-v1.0.0.json"
      - "docs/architecture/IROKA-A2-CHARACTER-CONFORMANCE-CATALOG-v1.0.0.json"
      - "docs/architecture/IROKA-A3-CHARACTER-GENE-IMPLEMENTATION-RECORD-v1.0.0.md"
      - "docs/architecture/G01-CREDENTIAL-VERIFICATION.md"
      - "docs/architecture/G01-IDENTITY-CONTRACT.md"
      - "docs/constitutional/IGACMS-A3-IMPLEMENTATION-RECORD.md"
      - ".github/workflows/rust-kernel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-kernel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, compile, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # PR validation must test the source head, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.100.0
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile all targets
        run: cargo check --workspace --all-targets --locked

      - name: Verify production feature set excludes development bypasses
        run: cargo check --workspace --all-targets --no-default-features

      - name: Run complete unit and contract test suite
        run: cargo test --workspace --all-targets --locked

      - name: Run static A3 gene schema and traceability audit
        run: python3 scripts/a3_schema_baseline_audit.py

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -A clippy::pedantic

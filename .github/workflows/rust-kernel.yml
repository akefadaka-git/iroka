name: Rust kernel verification

on:
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "docs/architecture/G01-CREDENTIAL-VERIFICATION.md"
      - "docs/architecture/G01-IDENTITY-CONTRACT.md"
      - ".github/workflows/rust-kernel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-kernel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, compile, test and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.1
          rustc --version
          cargo --version

      - name: Check canonical formatting
        run: cargo fmt --all -- --check

      - name: Compile all targets with the committed lockfile
        run: cargo check --locked --workspace --all-targets

      - name: Verify production feature set excludes development bypasses
        run: cargo check --locked --workspace --all-targets --no-default-features

      - name: Reject development bypass in non-test builds
        shell: bash
        run: |
          set +e
          cargo check --locked --workspace --all-targets --features dev-no-revocations > /tmp/dev-feature-check.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "ERROR: dev-no-revocations unexpectedly compiled outside test configuration"
            exit 1
          fi
          grep -F "dev-no-revocations is restricted to test builds" /tmp/dev-feature-check.log

      - name: Run complete unit and contract test suite
        run: cargo test --locked --workspace --all-targets

      - name: Run Clippy without development-only features
        run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings -A clippy::pedantic

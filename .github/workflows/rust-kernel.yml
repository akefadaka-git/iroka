name: Rust kernel verification

on:
  push:
    branches:
      - feat/igacms-a3-implementation
      - feat/a3-8-g01-tenant-reconciliation
      - feat/g05-postgres-g11-multiworker-a3
      - feat/g02-postgres-g09-resolver-a3
      - feat/g02-postgres-command-processor-a3
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "docs/constitutional/IGACMS-A3-IMPLEMENTATION-RECORD.md"
      - ".github/workflows/rust-kernel.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main, architecture/igacms-a2-ci-base, feat/a3-8-g02-owner-organization-authority, feat/g05-g02-g11-activation-v12, feat/g02-postgres-g09-resolver-a3]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "docs/architecture/G01-CREDENTIAL-VERIFICATION.md"
      - "docs/architecture/G01-IDENTITY-CONTRACT.md"
      - "docs/constitutional/IGACMS-A3-IMPLEMENTATION-RECORD.md"
      - ".github/workflows/rust-kernel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-kernel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, compile, test and lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iroka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iroka_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      IROKA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/iroka_test?sslmode=disable
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version


      - name: Apply canonical Rust formatting
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile all targets
        run: cargo check --workspace --all-targets --locked

      - name: Verify production feature set excludes development bypasses
        run: cargo check --workspace --all-targets --no-default-features

      - name: Run complete unit and contract test suite
        run: cargo test --workspace --all-targets --locked -- --test-threads=1

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -A clippy::pedantic

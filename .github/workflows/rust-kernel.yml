name: Rust kernel verification

on:
  push:
    branches: [feat/igacms-a3-implementation]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/rust-kernel.yml"
  pull_request:
    branches: [main, architecture/igacms-a2-ci-base]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "docs/architecture/G01-CREDENTIAL-VERIFICATION.md"
      - "docs/architecture/G01-IDENTITY-CONTRACT.md"
      - ".github/workflows/rust-kernel.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: rust-kernel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, compile, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version


      - name: Apply and commit Rust formatting on the A3 branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/igacms-a3-implementation'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo fmt --all
          git add crates/iroka-kernel/src/igacms.rs crates/iroka-kernel/src/lib.rs crates/iroka-kernel/src/service.rs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: format IGACMS Rust implementation"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            curl --fail-with-body -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/rust-kernel.yml/dispatches" \
              -d "{\"ref\":\"feat/igacms-a3-implementation\"}"
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile all targets
        run: cargo check --workspace --all-targets --locked

      - name: Verify production feature set excludes development bypasses
        run: cargo check --workspace --all-targets --no-default-features

      - name: Run complete unit and contract test suite
        run: cargo test --workspace --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -A clippy::pedantic

# Exact-head verification is triggered by pushes to the A3 implementation branch.

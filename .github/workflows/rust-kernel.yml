name: Rust kernel verification

on:
  push:
    branches:
      - fix/a2-trust-concurrency-workflow
      - fix/k04-witness-roster-fail-closed # K-04 stacked PR verification
      - fix/k04-a2-a3-remediation # K-04 A2/A3 remediation verification
      - feat/a2-conformance-regional-runtime # A2 conformance harness verification
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "tests/conformance/**"
      - "docs/assurance/**"
      - "docs/architecture/G01-CREDENTIAL-VERIFICATION.md"
      - "docs/architecture/G01-IDENTITY-CONTRACT.md"
      - ".github/workflows/rust-kernel.yml"
      - "docs/architecture/G11-K04-AUDIT-INTEGRITY-INDEPENDENT-CHECKPOINTS-001.md"
      - "docs/architecture/G11-K04-OWNER-DECISIONS-001.md"
      - "docs/operations/G11-K04-OPERATIONAL-ASSURANCE-RUNBOOK-001.md"
  pull_request:
    branches:
      - main
      - fix/a2-trust-concurrency-workflow
      - fix/k04-authorized-witness-roster
      - fix/k04-witness-roster-fail-closed
      - fix/k04-a2-a3-remediation
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "tests/conformance/**"
      - "docs/assurance/**"
      - "docs/architecture/G01-CREDENTIAL-VERIFICATION.md"
      - "docs/architecture/G01-IDENTITY-CONTRACT.md"
      - ".github/workflows/rust-kernel.yml"
      - "docs/architecture/G11-K04-AUDIT-INTEGRITY-INDEPENDENT-CHECKPOINTS-001.md"
      - "docs/architecture/G11-K04-OWNER-DECISIONS-001.md"
      - "docs/operations/G11-K04-OPERATIONAL-ASSURANCE-RUNBOOK-001.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-kernel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, compile, test and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.1
          rustc --version
          cargo --version

      - name: Check canonical formatting
        run: cargo fmt --all -- --check

      - name: Compile all targets with the committed lockfile
        run: cargo check --locked --workspace --all-targets

      - name: Verify production feature set excludes development bypasses
        run: cargo check --locked --workspace --all-targets --no-default-features

      - name: Reject development bypass in non-test builds
        shell: bash
        run: |
          set +e
          cargo check --locked --workspace --all-targets --features dev-no-revocations > /tmp/dev-feature-check.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "ERROR: dev-no-revocations unexpectedly compiled outside test configuration"
            exit 1
          fi
          grep -F "dev-no-revocations is restricted to test builds" /tmp/dev-feature-check.log

      - name: Run complete unit and contract test suite
        run: cargo test --locked --workspace --all-targets

      - name: Run Clippy without development-only features
        run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings -A clippy::pedantic

      - name: Generate exact-SHA A2 conformance disposition report
        env:
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IROKA_CHECKED_OUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IROKA_CHECKED_OUT_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: cargo run --locked -p iroka-kernel --bin iroka-conformance -- tests/conformance/catalog.json --output "$RUNNER_TEMP/iroka-a2-conformance-report.json"



name: A3 G04 knowledge-schema verification

on:
  push:
    branches:
      - implementation/a3-g04-knowledge-schema
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/a3_schema_baseline_audit.py"
      - ".github/workflows/a3-g04-knowledge-schema-verification.yml"
  pull_request:
    branches:
      - implementation/a3-g03-uncertainty-calculus
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/a3_schema_baseline_audit.py"
      - ".github/workflows/a3-g04-knowledge-schema-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a3-g04-knowledge-schema-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: G04 type-boundary, constraint, compile and test verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version
      - name: Apply canonical Rust formatting in verification workspace
        run: cargo fmt --all
      - name: Check Rust formatting after normalization
        run: cargo fmt --all -- --check
      - name: Emit formatted G04 source for exact-source reconciliation
        run: cat crates/iroka-kernel/src/knowledge_schema.rs
      - name: Compile G04 kernel and all targets
        run: cargo check -p iroka-kernel --all-targets --locked
      - name: Verify production feature set
        run: cargo check --workspace --all-targets --no-default-features --locked
      - name: Run G04 schema boundary and constraint tests
        run: cargo test -p iroka-kernel knowledge_schema::tests --locked
      - name: Run complete workspace tests
        run: cargo test --workspace --all-targets --locked
      - name: Run A3 schema and traceability audit
        run: python3 scripts/a3_schema_baseline_audit.py
      - name: Run Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -A clippy::pedantic

name: Temporary Rust formatting export

on:
  push:
    branches: [feat/ciw-amharic-answer-only-chat]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt && rustup default stable
      - name: Format and export exact source
        run: |
          cargo fmt --all
          echo IROKA_LIB_FORMATTED_BEGIN
          base64 -w0 crates/iroka-conversation/src/lib.rs
          echo
          echo IROKA_LIB_FORMATTED_END

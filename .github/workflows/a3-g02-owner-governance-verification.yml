name: A3 G02 Owner-governance verification

on:
  push:
    branches:
      - implementation/a3-g02-owner-governance
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "docs/architecture/a3/**"
      - "scripts/a3_schema_baseline_audit.py"
      - ".github/workflows/a3-g02-owner-governance-verification.yml"

permissions:
  contents: read

concurrency:
  group: a3-g02-owner-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, compile, test, audit and lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Compile all targets
        run: cargo check --workspace --all-targets --locked
      - name: Verify production feature set
        run: cargo check --workspace --all-targets --no-default-features --locked
      - name: Run unit and contract tests
        run: cargo test --workspace --all-targets --locked
      - name: Run A3 schema and traceability audit
        run: python3 scripts/a3_schema_baseline_audit.py
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -A clippy::pedantic

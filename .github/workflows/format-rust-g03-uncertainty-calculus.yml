name: Format Rust on G03 uncertainty-calculus branch

on:
  push:
    branches:
      - implementation/a3-g03-uncertainty-calculus
    paths:
      - "crates/**/*.rs"
      - ".github/workflows/format-rust-g03-uncertainty-calculus.yml"

permissions:
  contents: write

concurrency:
  group: format-rust-g03-uncertainty-calculus
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatting if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates
            git commit -m "style(g03): format uncertainty-calculus implementation"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi

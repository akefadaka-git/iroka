name: K-04 Rust formatting repair

on:
  push:
    branches:
      - fix/k04-witness-roster-fail-closed
    paths:
      - ".github/workflows/k04-rustfmt-export.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Install pinned Rust formatter
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt
          rustup default 1.85.1
      - name: Apply canonical Rust formatting
        run: cargo fmt --all
      - name: Commit formatting-only changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/iroka-kernel/src
          git commit -m "style(k04): apply canonical Rust formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"

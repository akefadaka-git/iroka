name: Native Cognition CI

on:
  push:
    branches:
      - feat/native-cognition-a3
      - feat/nce-03-constraint-solver-a3
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Format, test and lint native cognition
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format source for CI inspection
        run: cargo fmt --all
      - name: Emit rustfmt output for repository update
        run: |
          echo BEGIN_FORMATTED_CONSTRAINTS
          cat crates/iroka-cognition/src/constraints.rs
          echo END_FORMATTED_CONSTRAINTS
      - name: Test workspace
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy -p iroka-cognition --all-targets -- -D warnings

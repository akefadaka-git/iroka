name: Native Cognition CI

on:
  push:
    branches:
      - feat/native-cognition-a3
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Format, test and lint native cognition
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Normalize Rust formatting and export backward source
        run: |
          cargo fmt --all
          echo "RUSTFMT_BACKWARD_BEGIN"
          base64 -w0 crates/iroka-cognition/src/backward.rs
          echo
          echo "RUSTFMT_BACKWARD_END"
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy -p iroka-cognition --all-targets -- -D warnings

name: Native Cognition CI

on:
  push:
    branches:
      - feat/native-cognition-a3
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Test and lint native cognition
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check (non-blocking while initial sources are normalized)
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -A clippy::pedantic -D warnings

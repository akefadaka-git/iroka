name: Native Cognition CI

on:
  push:
    branches:
      - feat/native-cognition-a3
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Format, test and lint native cognition
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Resolve workspace lockfile and export
        run: |
          cargo check --workspace --all-targets
          echo "CARGO_LOCK_BEGIN"
          base64 -w0 Cargo.lock
          echo
          echo "CARGO_LOCK_END"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy -p iroka-cognition --all-targets -- -D warnings

name: G08 branch rustfmt repair

on:
  push:
    branches:
      - feat/g08-a3-durable-coordinator

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[skip g08-format]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/g08-a3-durable-coordinator
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Commit formatting-only changes
        run: |
          if git diff --quiet; then
            echo "Rust formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style(g08): apply rustfmt [skip g08-format]"
          git push origin HEAD:feat/g08-a3-durable-coordinator

name: GENESIS gene schema closure
on:
  push:
    branches: [architecture/genesis-gene-contract-amendment-proposal]
    paths:
      - "crates/iroka-kernel/igacms/genome-v1.0.0.json"
      - "crates/iroka-kernel/igacms/schemas/genes/**"
      - "crates/iroka-kernel/igacms/conformance/**"
      - "docs/architecture/GENESIS-GENE-IO-CONTRACT-AMENDMENT-A1-PROPOSAL-v1.0.0.json"
      - "tools/genesis/**"
      - ".github/workflows/genesis-gene-schemas.yml"
  pull_request:
    branches:
      - main
      - architecture/genesis-gene-contract-amendment-proposal
    paths:
      - "crates/iroka-kernel/igacms/genome-v1.0.0.json"
      - "crates/iroka-kernel/igacms/schemas/genes/**"
      - "crates/iroka-kernel/igacms/conformance/**"
      - "docs/architecture/GENESIS-GENE-IO-CONTRACT-AMENDMENT-A1-PROPOSAL-v1.0.0.json"
      - "docs/architecture/IROKA-A2-CHARACTER-*.json"
      - "docs/architecture/IROKA-A2-CHARACTER-*.md"
      - "docs/constitutional/IROKA-CHARACTER-CONSTITUTION-v1.0.0.md"
      - "tools/genesis/**"
      - ".github/workflows/genesis-gene-schemas.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: genesis-gene-schemas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  resolve-and-conform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned JSON Schema validator
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Resolve all 72 references and execute gene IO conformance
        run: python3 tools/genesis/validate_gene_schemas.py
      - name: Validate character A2 overlay, catalog and schema bindings
        if: github.event_name == 'pull_request' && github.base_ref == 'architecture/genesis-gene-contract-amendment-proposal'
        run: python3 tools/genesis/validate_character_a2.py
      - name: Validate approved 53 collection item contracts
        run: python3 tools/genesis/validate_collection_item_amendment.py
      - name: Execute cross-collection semantic integration conformance
        run: python3 tools/genesis/validate_semantic_integration.py

name: A3 G07 agent-principal verification

on:
  push:
    branches:
      - implementation/a3-g07-agent-principal
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/a3-g07-agent-principal-verification.yml"
  pull_request:
    branches:
      - implementation/a3-g06-perception-transform
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/a3-g07-agent-principal-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a3-g07-agent-principal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: G07 agent identity, type, compile and test verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version
      - name: Apply canonical Rust formatting in verification workspace
        run: cargo fmt --all
      - name: Check Rust formatting after normalization
        run: cargo fmt --all -- --check
      - name: Emit G07 source for exact-source reconciliation
        run: |
          cat crates/iroka-kernel/src/agent_principal.rs
          cat crates/iroka-kernel/src/lib.rs
      - name: Compile kernel and all targets
        run: cargo check -p iroka-kernel --all-targets --locked
      - name: Verify production feature set
        run: cargo check --workspace --all-targets --no-default-features --locked
      - name: Run G07-specific tests
        run: cargo test -p iroka-kernel agent_principal::tests --locked
      - name: Run complete workspace tests
        run: cargo test --workspace --all-targets --locked
      - name: Run Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -A clippy::pedantic

name: A3 G06 perception-transform verification

on:
  push:
    branches:
      - implementation/a3-g06-perception-transform
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/a3-g06-perception-transform-verification.yml"
  pull_request:
    branches:
      - implementation/a3-g05-memory-classification
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/a3-g06-perception-transform-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a3-g06-perception-transform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: G06 perception policy, type, compile and test verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version
      - name: Check committed Rust formatting
        run: cargo fmt --all -- --check
      - name: Compile kernel and all targets
        run: cargo check -p iroka-kernel --all-targets --locked
      - name: Verify production feature set
        run: cargo check --workspace --all-targets --no-default-features --locked
      - name: Run G06-specific tests
        run: cargo test -p iroka-kernel perception_transform::tests --locked
      - name: Run complete workspace tests
        run: cargo test --workspace --all-targets --locked
      - name: Run Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -A clippy::pedantic
